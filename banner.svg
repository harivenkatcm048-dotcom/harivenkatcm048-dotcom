<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="250">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;family=Outfit:wght@800&amp;display=swap');
    .title {
      font-family: 'Outfit', 'Inter', -apple-system, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#text-grad);
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: 'Inter', -apple-system, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #a5b4fc;
      letter-spacing: 5px;
    }
    .tagline {
      font-family: 'Inter', -apple-system, sans-serif;
      font-weight: 400;
      font-size: 12px;
      fill: #94a3b8;
      letter-spacing: 1px;
    }
    .code-symbol {
      font-family: monospace;
      font-weight: 800;
      font-size: 60px;
      fill: #4338ca;
      opacity: 0.25;
    }
  </style>

  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="35%" stop-color="#c084fc" />
      <stop offset="70%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0" />
      <stop offset="30%" stop-color="#818cf8" stop-opacity="1" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="1" />
      <stop offset="70%" stop-color="#f472b6" stop-opacity="1" />
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="250" fill="url(#bg-grad)" />
  
  <!-- Grid -->
  <rect width="800" height="250" fill="url(#grid)" />

  <!-- Ambient Glows -->
  <circle cx="150" cy="125" r="100" fill="#6366f1" opacity="0.25" filter="url(#glow)" />
  <circle cx="650" cy="125" r="120" fill="#d946ef" opacity="0.2" filter="url(#glow)" />
  <circle cx="400" cy="200" r="80" fill="#3b82f6" opacity="0.15" filter="url(#glow)" />

  <!-- Background code elements -->
  <text x="50" y="150" class="code-symbol" text-anchor="start">&lt;</text>
  <text x="750" y="150" class="code-symbol" text-anchor="end">/&gt;</text>

  <!-- Center Title -->
  <text x="400" y="105" class="title" text-anchor="middle">HARI KOTHAPALLI</text>
  
  <!-- Subtitle -->
  <text x="400" y="145" class="subtitle" text-anchor="middle">AI AUTOMATION &amp; FULL STACK ARCHITECT</text>
  
  <!-- Divider -->
  <line x1="200" y1="168" x2="600" y2="168" stroke="url(#line-grad)" stroke-width="2" />
  
  <!-- Tagline -->
  <text x="400" y="195" class="tagline" text-anchor="middle">Building Intelligent Workflows &amp; High-Performance SaaS Apps</text>
</svg>
